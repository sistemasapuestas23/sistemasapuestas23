name: Football Prediction Engine CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 black

      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=12 --max-line-length=120 --statistics

      - name: Format check with black
        run: black --check --line-length 120 .

      - name: Syntax validation of all modules
        run: |
          python -c "import config.settings"
          python -c "from data_loader.thestatsapi_client import TheStatsAPIClient"
          python -c "from feature_engineering.feature_builder import FeatureBuilder"
          python -c "from models.poisson_dixon_coles import DixonColesPoisson"
          python -c "from models.xgboost_multiclass import XGBoostMulticlass"
          python -c "from models.catboost_multiclass import CatBoostMulticlass"
          python -c "from models.dnn_pytorch import DNNClassifier"
          python -c "from models.lstm_pytorch import LSTMClassifier"
          python -c "from models.lstm_momentum_pytorch import LSTMMomentumClassifier"
          python -c "from models.meta_ensemble import StackingMetaEnsemble"
          python -c "from training.trainer import FullTrainer"
          python -c "from inference.predictor import Predictor"
          python -c "from pipeline.full_pipeline import FullPipeline"
          echo "All modules import successfully"

  # Optional: dry-run training job (requires THESTATSAPI_API_KEY secret)
  dry-run-train:
    runs-on: ubuntu-latest
    needs: test-and-lint
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Dry-run import + config check
        env:
          THESTATSAPI_API_KEY: ${{ secrets.THESTATSAPI_API_KEY }}
        run: |
          if [ -z "$THESTATSAPI_API_KEY" ]; then
            echo "THESTATSAPI_API_KEY secret not set – skipping live API test"
            exit 0
          fi
          python -c "
          from config.settings import THESTATSAPI_API_KEY
          from data_loader.thestatsapi_client import TheStatsAPIClient
          client = TheStatsAPIClient()
          print('Client instantiated successfully')
          client.close()
          "
